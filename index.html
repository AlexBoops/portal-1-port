<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>PORTAL // APERTURE LABORATORIES</title>

    <script src="coi-serviceworker.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      @font-face {
        font-family: 'ApertureMono';
        src: local('Consolas'), local('Lucida Console'), local('Courier New'), monospace;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d0f12;
        color: #dbe2ea;
        font-family: 'ApertureMono', -apple-system, monospace;
      }

      /* Game Canvas Viewport */
      #canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        outline: none;
        background: #000;
        cursor: default;
      }

      /* Aperture Science Terminal Theme */
      #launcher-ui {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: radial-gradient(circle at 50% 45%, #18202c 0%, #0c1017 70%, #05070a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      /* CRT Scanline Overlay */
      #launcher-ui::before {
        content: " ";
        display: block;
        position: absolute;
        inset: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 51;
        pointer-events: none;
        opacity: 0.6;
      }

      #launcher-ui.hidden {
        display: none !important;
      }

      .terminal-frame {
        position: relative;
        z-index: 52;
        background: rgba(13, 17, 23, 0.94);
        border: 1px solid #30363d;
        border-top: 3px solid #00b4d8;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 180, 216, 0.1);
        width: 100%;
        max-width: 580px;
        padding: 2.2rem;
      }

      .header-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed #21262d;
        padding-bottom: 0.8rem;
        margin-bottom: 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.15em;
        color: #7d8590;
      }

      .header-meta .tag-id {
        color: #00b4d8;
        font-weight: 700;
      }

      .brand-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin-bottom: 0.4rem;
      }

      .brand-title {
        font-size: 2.1rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        color: #f0f6fc;
        text-transform: uppercase;
        text-shadow: 0 0 16px rgba(0, 180, 216, 0.4);
      }

      .brand-sub {
        font-size: 0.75rem;
        color: #ff9e00;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .log-console {
        background: #06090e;
        border: 1px solid #161b22;
        padding: 0.9rem 1.1rem;
        margin: 1.4rem 0;
        font-size: 0.78rem;
        line-height: 1.6;
        color: #8b949e;
      }

      .log-console .log-entry {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .log-console .log-entry span {
        color: #00b4d8;
      }

      .btn-terminal {
        width: 100%;
        background: #00b4d8;
        color: #040d12;
        border: 1px solid #00b4d8;
        padding: 1rem;
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.15s ease-out;
      }

      .btn-terminal:hover:not(:disabled) {
        background: #38bdf8;
        border-color: #38bdf8;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      }

      .btn-terminal:disabled {
        background: #161b22;
        border-color: #21262d;
        color: #484f58;
        cursor: not-allowed;
      }

      #progress-box {
        display: none;
        margin-top: 1.4rem;
      }

      .meter-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.74rem;
        color: #8b949e;
        margin-bottom: 0.4rem;
        letter-spacing: 0.08em;
      }

      .meter-labels #txt-pct {
        color: #00b4d8;
        font-weight: bold;
      }

      .meter-rail {
        width: 100%;
        height: 8px;
        background: #06090e;
        border: 1px solid #21262d;
        overflow: hidden;
      }

      .meter-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #0077b6, #00b4d8);
        box-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
        transition: width 0.08s linear;
      }

      .meter-sub {
        display: flex;
        justify-content: space-between;
        font-size: 0.68rem;
        color: #484f58;
        margin-top: 0.45rem;
      }

      #crash-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(4, 7, 10, 0.95);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      #crash-overlay.active {
        display: flex !important;
      }

      .crash-card {
        background: #0d1117;
        border: 1px solid #f85149;
        max-width: 680px;
        width: 100%;
        padding: 1.8rem;
        box-shadow: 0 0 40px rgba(248, 81, 73, 0.2);
      }

      .crash-title {
        color: #f85149;
        font-size: 0.88rem;
        font-weight: bold;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 0.8rem;
      }

      .crash-pre {
        background: #06090e;
        color: #ff7b72;
        font-size: 0.75rem;
        padding: 1rem;
        max-height: 260px;
        overflow-y: auto;
        white-space: pre-wrap;
        border: 1px solid #21262d;
        margin-bottom: 1.2rem;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="launcher-ui">
      <div class="terminal-frame">
        <div class="header-meta">
          <span>APERTURE LABORATORIES ENRICHMENT CORE</span>
          <span class="tag-id">STATION-04 // RELEASE</span>
        </div>

        <div class="brand-row">
          <div class="brand-title">PORTAL</div>
          <div class="brand-sub">WASM-SRC-1.0</div>
        </div>

        <div class="log-console">
          <div class="log-entry">> <span>SYS_INIT</span>: GITHACK ASSET SPLIT INTERFACE ACTIVE</div>
          <div class="log-entry">> <span>THREADS</span>: SAB SECURITY BUFFER SYNCHRONIZED</div>
          <div class="log-entry">> <span>TARGET</span>: CHAMBER TESTCHMB_A_00.BSP</div>
        </div>

        <button id="btn-start" class="btn-terminal" onclick="startApp()" disabled>AWAITING ISOLATION...</button>

        <div id="progress-box">
          <div class="meter-labels">
            <span id="txt-status">STREAMING ASSETS</span>
            <span id="txt-pct">0%</span>
          </div>
          <div class="meter-rail">
            <div id="bar-fill" class="meter-fill"></div>
          </div>
          <div class="meter-sub">
            <span id="txt-file">Verifying pack hashes...</span>
            <span id="txt-bytes">0 MB / 380 MB</span>
          </div>
        </div>
      </div>
    </div>

    <div id="crash-overlay">
      <div class="crash-card">
        <div class="crash-title">RUNTIME INTERCEPT HALT</div>
        <pre id="crash-log" class="crash-pre"></pre>
        <button class="btn-terminal" onclick="location.reload()">RE-INITIALIZE ENGINE</button>
      </div>
    </div>

    <script type="text/javascript">
      const SPLIT_FILES = {
        'portal_audio.data': 46,
        'background1.data': 7,
        'escape_00.data': 2,
        'escape_01.data': 2,
        'escape_02.data': 3,
        'testchmb_a_00.data': 3,
        'testchmb_a_03.data': 2,
        'testchmb_a_07.data': 2,
        'testchmb_a_10.data': 2,
        'testchmb_a_13.data': 2,
        'testchmb_a_14.data': 2,
        'testchmb_a_14_advanced.data': 2,
        'testchmb_a_15.data': 5
      };

      const canvasElement = document.getElementById('canvas');
      const launcherUi = document.getElementById('launcher-ui');
      const btnStart = document.getElementById('btn-start');
      const progressBox = document.getElementById('progress-box');
      const txtStatus = document.getElementById('txt-status');
      const txtPct = document.getElementById('txt-pct');
      const barFill = document.getElementById('bar-fill');
      const txtFile = document.getElementById('txt-file');
      const txtBytes = document.getElementById('txt-bytes');
      const crashOverlay = document.getElementById('crash-overlay');
      const crashLog = document.getElementById('crash-log');

      let g_totalExpected = 380 * 1024 * 1024;
      let g_downloaded = 0;
      let g_launched = false;
      let g_engineInitialized = false;

      /* =========================================================
         FIX: POINTER LOCK & ESCAPE CURSOR RE-APPEARANCE
         ========================================================= */

      // Force canvas to restore pointer visibility whenever escape unlocks the mouse
      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement !== canvasElement) {
          canvasElement.style.cursor = 'default';
          document.body.style.cursor = 'default';
        } else {
          canvasElement.style.cursor = 'none';
        }
      });

      function requestEngineLock() {
        if (!g_engineInitialized) return;
        if (document.pointerLockElement === canvasElement) return;

        try {
          const promise = canvasElement.requestPointerLock();
          if (promise && typeof promise.catch === 'function') {
            promise.catch(() => {});
          }
        } catch(e) {}
      }

      // Re-grab lock on click if game is running; unlock shows normal cursor
      canvasElement.addEventListener('click', requestEngineLock);

      // Handle Escape key: explicitly restore pointer visibility on canvas
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' || e.key === 'Escape') {
          if (document.pointerLockElement) {
            document.exitPointerLock();
          }
          canvasElement.style.cursor = 'default';
          document.body.style.cursor = 'default';
        }
      });

      /* =========================================================
         ISOLATION & UI STATE HANDLERS
         ========================================================= */

      function checkIsolation() {
        if (window.crossOriginIsolated) {
          btnStart.disabled = false;
          btnStart.textContent = 'INITIALIZE SYSTEM';
        } else {
          btnStart.disabled = true;
          btnStart.textContent = 'AWAITING ISOLATION...';
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            window.location.reload();
          }
        }
      }

      window.addEventListener('load', () => {
        checkIsolation();
        setTimeout(checkIsolation, 1000);
      });

      function updateUI(status, file, bytesAdded) {
        if (status) txtStatus.textContent = status;
        if (file) txtFile.textContent = file;
        if (bytesAdded) g_downloaded += bytesAdded;

        const dlMB = (g_downloaded / (1024 * 1024)).toFixed(1);
        const totMB = (g_totalExpected / (1024 * 1024)).toFixed(1);
        txtBytes.textContent = `${dlMB} MB / ${totMB} MB`;

        const pct = Math.min(99, Math.round((g_downloaded / g_totalExpected) * 100));
        txtPct.textContent = `${pct}%`;
        barFill.style.width = `${pct}%`;
      }

      function showCrash(err) {
        crashLog.textContent = (err && err.stack) ? err.stack : (typeof err === 'string' ? err : JSON.stringify(err));
        crashOverlay.classList.add('active');
        canvasElement.style.cursor = 'default';
      }

      window.onerror = (m, u, l, c, e) => showCrash(e || m);
      window.onunhandledrejection = (e) => showCrash(e.reason);

      var g_pendingResize = null;
      window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        g_pendingResize = [w, h];
        if (window.Module && Module._JSRequestResize) {
          Module._JSRequestResize(w, h);
          g_pendingResize = null;
        }
      });

      /* =========================================================
         LOCAL REPOSITORY CHUNK ASSEMBLY
         ========================================================= */

      async function fetchPart(baseName, partIdx) {
        const pad4 = String(partIdx).padStart(4, '0');
        const paths = [
          `chunks/${baseName}.part${pad4}`,
          `${baseName}.part${pad4}`
        ];

        for (const p of paths) {
          try {
            const res = await origFetch(p);
            if (res.ok) {
              const buf = await res.arrayBuffer();
              updateUI(undefined, `${baseName} (.part${pad4})`, buf.byteLength);
              return buf;
            }
          } catch(e) {}
        }
        throw new Error(`Failed to read chunk: ${baseName}.part${pad4}`);
      }

      const g_chunkAssembly = {};
      async function assembleSplit(splitInfo) {
        const { baseName, totalParts } = splitInfo;
        if (g_chunkAssembly[baseName]) return g_chunkAssembly[baseName];

        g_chunkAssembly[baseName] = (async () => {
          const buffers = [];
          let totalLen = 0;
          for (let i = 1; i <= totalParts; i++) {
            updateUI('STREAMING CHUNKS', `${baseName} (${i}/${totalParts})`);
            const b = await fetchPart(baseName, i);
            buffers.push(b);
            totalLen += b.byteLength;
          }

          const combined = new Uint8Array(totalLen);
          let offset = 0;
          for (let i = 0; i < buffers.length; i++) {
            combined.set(new Uint8Array(buffers[i]), offset);
            offset += buffers[i].byteLength;
            buffers[i] = null;
          }
          buffers.length = 0;
          return combined.buffer;
        })();

        return g_chunkAssembly[baseName];
      }

      function getSplitTarget(url) {
        if (!url) return null;
        for (const [baseName, totalParts] of Object.entries(SPLIT_FILES)) {
          if (url.includes(baseName)) return { baseName, totalParts };
        }
        return null;
      }

      const origFetch = window.fetch.bind(window);
      window.fetch = async function(input, init) {
        const url = (typeof input === 'string') ? input : (input && input.url) ? input.url : '';
        const split = getSplitTarget(url);
        if (split) {
          try {
            const assembled = await assembleSplit(split);
            return new Response(assembled, { status: 200, statusText: 'OK' });
          } catch(e) {
            return new Response(new ArrayBuffer(0), { status: 200, statusText: 'OK' });
          }
        }
        return origFetch(input, init);
      };

      const OrigXHR = window.XMLHttpRequest;
      window.XMLHttpRequest = function() {
        const xhr = new OrigXHR();
        let targetUrl = '';

        const origOpen = xhr.open;
        xhr.open = function(method, url, ...rest) {
          targetUrl = url;
          return origOpen.call(this, method, url, ...rest);
        };

        const origSend = xhr.send;
        xhr.send = function(body) {
          const split = getSplitTarget(targetUrl);
          if (split) {
            assembleSplit(split).then(buffer => {
              Object.defineProperty(xhr, 'status', { get: () => 200 });
              Object.defineProperty(xhr, 'statusText', { get: () => 'OK' });
              Object.defineProperty(xhr, 'readyState', { get: () => 4 });
              Object.defineProperty(xhr, 'response', { get: () => buffer });
              Object.defineProperty(xhr, 'responseText', { get: () => '' });

              const evt = new ProgressEvent('load', { loaded: buffer.byteLength, total: buffer.byteLength, lengthComputable: true });
              if (typeof xhr.onprogress === 'function') xhr.onprogress(evt);
              if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange(new Event('readystatechange'));
              if (typeof xhr.onload === 'function') xhr.onload(evt);
              else xhr.dispatchEvent(evt);
              if (typeof xhr.onloadend === 'function') xhr.onloadend(new ProgressEvent('loadend'));
            }).catch(e => {
              if (typeof xhr.onerror === 'function') xhr.onerror(new ProgressEvent('error'));
              xhr.dispatchEvent(new ProgressEvent('error'));
            });
            return;
          }
          return origSend.call(this, body);
        };
        return xhr;
      };

      /* =========================================================
         SOURCE ENGINE WASM BINDINGS
         ========================================================= */

      var Module = {
        canvas: canvasElement,
        locateFile: (p) => p,
        totalDependencies: 0,
        setStatus: (text) => {
          if (text) updateUI('INITIALIZING', text);
        },
        monitorRunDependencies: (left) => {
          if (left > 0) updateUI('MOUNTING LIBS', `Linking ${left} dynamic libraries...`);
        },
        print: function(text) {
          console.log(text);
          if (text.includes('Game initializing') || text.includes('Host_Init') || text.includes('Map: background1') || text.includes('Map: testchmb_a_00')) {
            txtPct.textContent = '100%';
            barFill.style.width = '100%';
            updateUI('COMPLETE', 'Chamber Loaded');
            setTimeout(() => {
              launcherUi.classList.add('hidden');
              g_engineInitialized = true;
              canvasElement.focus();
              requestEngineLock();
            }, 500);
          }
        },
        printErr: function(text) {
          console.error(text);
          if (/crash|abort|runtimeerror|fatal|exception|assertion failed/i.test(text)) {
            showCrash(text);
          }
        },
        onRuntimeInitialized: function() {
          if (window.g_pendingResize && Module._JSRequestResize) {
            Module._JSRequestResize(g_pendingResize[0], g_pendingResize[1]);
            window.g_pendingResize = null;
          }
        },
        preRun: [
          function() {
            const origRemove = Module.removeRunDependency;
            if (typeof origRemove === 'function') {
              Module.removeRunDependency = function(id) {
                if (typeof runDependencyTracking !== 'undefined' && !runDependencyTracking[id]) return;
                try { origRemove.call(Module, id); } catch(e) {}
              };
            }

            const watchdog = setInterval(() => {
              if (typeof FS !== 'undefined') {
                try {
                  const chk = FS.analyzePath('/portal/maps/testchmb_a_00.bsp');
                  if (chk && chk.exists) {
                    txtPct.textContent = '100%';
                    barFill.style.width = '100%';
                    updateUI('COMPLETE', 'Chamber 00 ready.');
                    setTimeout(() => {
                      launcherUi.classList.add('hidden');
                      g_engineInitialized = true;
                      canvasElement.focus();
                      requestEngineLock();
                    }, 1200);
                    clearInterval(watchdog);
                  }
                } catch(e) {}
              }
            }, 1000);

            setInterval(() => {
              if (typeof runDependencyTracking !== 'undefined') {
                for (const dep in runDependencyTracking) {
                  if (dep === 'loadDylibs' || dep === 'load_game_data') {
                    try { Module.removeRunDependency(dep); } catch(e) {}
                  }
                }
              }
            }, 3000);

            if (typeof FS !== 'undefined') {
              FS.syncfs = (p, cb) => {
                const fn = (typeof p === 'function') ? p : cb;
                if (fn) setTimeout(() => fn(null), 0);
              };
            }
          }
        ]
      };

      let _downloadMapHandler = null;
      Object.defineProperty(Module, 'downloadMap', {
        configurable: true,
        enumerable: true,
        get: () => _downloadMapHandler,
        set: (origFn) => {
          _downloadMapHandler = function(lock, mapName) {
            function _release() {
              try { Atomics.store(HEAP32, lock >> 2, 0); Atomics.notify(HEAP32, lock >> 2); } catch(e) {}
              try { Atomics.store(HEAP32, lock, 0); Atomics.notify(HEAP32, lock); } catch(e) {}
            }
            window.audioLoaded = true;
            if (window.dataLoader) {
              window.dataLoader.loadMapWithDeps(mapName).then(_release).catch(_release);
            } else if (typeof origFn === 'function') {
              try { origFn(lock, mapName); } catch(e) { _release(); }
            } else {
              _release();
            }
          };
        }
      });

      function startApp() {
        if (!window.crossOriginIsolated) {
          alert('SharedArrayBuffer isolation is not active yet. Reloading...');
          window.location.reload();
          return;
        }

        if (g_launched) return;
        g_launched = true;

        btnStart.style.display = 'none';
        progressBox.style.display = 'block';
        updateUI('EXECUTING', 'Loading engine core...');

        if (typeof AL !== 'undefined' && AL.currentCtx && AL.currentCtx.audioCtx && AL.currentCtx.audioCtx.state === 'suspended') {
          AL.currentCtx.audioCtx.resume();
        }

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'index.js';
        script.onerror = (e) => showCrash('Failed loading local index.js: ' + e);
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
